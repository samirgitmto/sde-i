spring.application.name=jpa-scenarios

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 Database Connection Properties
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Enable parameter binding logs (MUST be TRACE, not DEBUG)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# (Optional) For extra fetch strategy debugging
logging.level.org.hibernate.loader.Loader=DEBUG

# Ensure no conflicting logging filters
logging.level.org.springframework=INFO
logging.level.org.hibernate.type=TRACE