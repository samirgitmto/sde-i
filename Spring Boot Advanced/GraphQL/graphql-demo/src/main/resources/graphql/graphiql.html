<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GraphiQL</title>
  <style>
    body { height: 100%; margin: 0; width: 100%; overflow: hidden; }
    #graphiql { height: 100vh; }
  </style>
  <!-- Pinned versions: Boot 3.3's built-in page uses unpinned unpkg URLs and often sticks on Loading... -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/graphiql@3.0.9/graphiql.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/graphiql@3.0.9/graphiql.min.css" />
</head>
<body>
  <div id="graphiql">Loading...</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const path = params.get("path") || "/graphql";
    const url = location.protocol + "//" + location.host + path;
    const fetcher = GraphiQL.createFetcher({ url });
    ReactDOM.render(
      React.createElement(GraphiQL, { fetcher }),
      document.getElementById("graphiql")
    );
  </script>
</body>
</html>
