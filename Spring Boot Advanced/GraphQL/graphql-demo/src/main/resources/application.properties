spring.application.name=graphql-demo

# H2
spring.datasource.url=jdbc:h2:mem:graphqldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# GraphQL / GraphiQL
# Built-in GraphiQL disabled: it loads unpinned unpkg scripts and often sticks on "Loading..."
# Custom GraphiQL is served from GraphiQlConfig at /graphiql
spring.graphql.graphiql.enabled=false
